<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منصة الألعاب المتقدمة | 21-in-1 Game Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        neon: { cyan: '#00f3ff', magenta: '#ff00ff', yellow: '#ffe600', green: '#00ff66' }
                    },
                    fontFamily: { cairo: ['Cairo', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0b0f19; color: #f3f4f6; user-select: none; touch-action: manipulation; }
        .neon-glow { box-shadow: 0 0 15px rgba(0, 243, 255, 0.4); }
        .neon-border { border: 1px solid rgba(0, 243, 255, 0.3); }
        .glass-panel { background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .card-hover { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .card-hover:hover { transform: translateY(-6px) scale(1.02); box-shadow: 0 10px 25px -5px rgba(0, 243, 255, 0.3); }
        /* Custom scrollbars */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0b0f19; }
        ::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #00f3ff; }
        canvas { touch-action: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col overflow-x-hidden bg-slate-950 text-slate-100 select-none">

    <!-- Top Navigation Header -->

                    <i class="fa-solid fa-gamepad"></i>
                </div>
                <div>
                    <h1 class="text-xl font-extrabold tracking-wide bg-gradient-to-r from-cyan-400 via-fuchsia-400 to-amber-300 bg-clip-text text-transparent">
                        21-IN-1 GAME HUB
                    </h1>
                    <p class="text-xs text-slate-400 hidden sm:block">عالم الألعاب السريعة والتحدي</p>
                </div>
            </div>

            <!-- Controls & Stats -->
            <div class="flex items-center gap-2 sm:gap-4">
                <div class="hidden sm:flex items-center gap-2 bg-slate-900/80 px-3 py-1.5 rounded-lg border border-slate-800 text-sm">
                    <i class="fa-solid fa-trophy text-amber-400"></i>
                    <span class="text-xs text-slate-400">المجموع:</span>
                    <span id="total-score-badge" class="font-bold text-cyan-400">0</span>
                </div>

                <button id="sound-toggle-btn" onclick="sound.toggleSound()" class="p-2.5 rounded-lg bg-slate-900 border border-slate-800 text-slate-300 hover:text-cyan-400 hover:border-cyan-500/50 transition" title="الصوت">
                    <i class="fa-solid fa-volume-high text-lg"></i>
                </button>

                <button onclick="app.toggleFullscreen()" class="p-2.5 rounded-lg bg-slate-900 border border-slate-800 text-slate-300 hover:text-cyan-400 hover:border-cyan-500/50 transition" title="ملء الشاشة">
                    <i class="fa-solid fa-expand text-lg"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Dashboard View -->
    <main id="dashboard-view" class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 md:p-8">
        <!-- Search & Filter Bar -->
        <div class="mb-8 flex flex-col md:flex-row gap-4 justify-between items-center">
            <div class="relative w-full md:w-80">
                <i class="fa-solid fa-magnifying-glass absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="game-search" oninput="app.filterGames()" placeholder="ابحث عن لعبة..." 
                    class="w-full pl-4 pr-10 py-2.5 rounded-xl bg-slate-900 border border-slate-800 text-slate-200 placeholder-slate-500 focus:outline-none focus:border-cyan-500 transition">
            </div>

            <div id="category-filters" class="flex flex-wrap gap-2 w-full md:w-auto justify-start md:justify-end">
                <button onclick="app.setCategory('all')" class="cat-btn active px-4 py-1.5 rounded-lg text-sm font-semibold bg-cyan-500 text-slate-950 shadow-md shadow-cyan-500/20">الكل</button>
                <button onclick="app.setCategory('action')" class="cat-btn px-4 py-1.5 rounded-lg text-sm font-semibold bg-slate-900 text-slate-400 hover:text-slate-200 border border-slate-800">أكشن</button>
                <button onclick="app.setCategory('puzzle')" class="cat-btn px-4 py-1.5 rounded-lg text-sm font-semibold bg-slate-900 text-slate-400 hover:text-slate-200 border border-slate-800">ألغاز</button>
                <button onclick="app.setCategory('arcade')" class="cat-btn px-4 py-1.5 rounded-lg text-sm font-semibold bg-slate-900 text-slate-400 hover:text-slate-200 border border-slate-800">آركيد</button>
                <button onclick="app.setCategory('classic')" class="cat-btn px-4 py-1.5 rounded-lg text-sm font-semibold bg-slate-900 text-slate-400 hover:text-slate-200 border border-slate-800">كلاسيك</button>
            </div>
        </div>

        <!-- Games Grid -->
        <div id="games-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-7 gap-4">
            <!-- Dynamic Injection of 21 Games -->
        </div>
    </main>

    <!-- Active Game Modal / Screen -->
    <div id="game-view" class="fixed inset-0 z-50 bg-slate-950/95 flex flex-col hidden backdrop-blur-md">
        <!-- Game View Top Header -->
        <div class="px-4 py-2 bg-slate-900 border-b border-slate-800 flex items-center justify-between">
            <button onclick="app.closeGame()" class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 transition text-sm">
                <i class="fa-solid fa-arrow-right"></i>
                <span class="hidden sm:inline">القائمة الرئيسية</span>
            </button>

            <div class="text-center">
                <h2 id="active-game-title" class="text-base sm:text-lg font-bold text-cyan-400">اسم اللعبة</h2>
                <div class="text-xs text-slate-400">
                    النتيجة: <span id="current-score" class="text-amber-400 font-bold text-sm">0</span> | 
                    أفضل نتيجة: <span id="high-score" class="text-emerald-400 font-bold">0</span>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <button onclick="app.restartActiveGame()" class="p-2 rounded-lg bg-slate-800 text-slate-300 hover:text-cyan-400 transition" title="إعادة التشغيل">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
                <button onclick="app.toggleVirtualController()" class="p-2 rounded-lg bg-slate-800 text-slate-300 hover:text-cyan-400 transition md:hidden" title="أزرار التحكم">
                    <i class="fa-solid fa-gamepad"></i>
                </button>
            </div>
        </div>

        <!-- Game Canvas / Interactive Container -->
        <div class="flex-1 relative flex items-center justify-center p-2 overflow-hidden bg-slate-950">
            <div id="game-stage" class="relative w-full h-full max-w-4xl max-h-[85vh] flex items-center justify-center">
                <!-- Canvas or Custom UI rendered here dynamically -->
            </div>
        </div>

        <!-- Mobile Touch Controller Bar -->
        <div id="touch-controls" class="bg-slate-900/90 border-t border-slate-800 p-3 flex justify-between items-center max-w-md mx-auto w-full rounded-t-2xl hidden select-none">
            <!-- D-Pad Left -->
            <div class="grid grid-cols-3 gap-1 w-32 h-32 relative">
                <div></div>
                <button id="btn-up" class="bg-slate-800 active:bg-cyan-600 text-slate-200 rounded-lg flex items-center justify-center text-xl shadow"><i class="fa-solid fa-caret-up"></i></button>
                <div></div>
                <button id="btn-left" class="bg-slate-800 active:bg-cyan-600 text-slate-200 rounded-lg flex items-center justify-center text-xl shadow"><i class="fa-solid fa-caret-right"></i></button> <!-- RTL mapping -->
                <div class="bg-slate-900 rounded-lg"></div>
                <button id="btn-right" class="bg-slate-800 active:bg-cyan-600 text-slate-200 rounded-lg flex items-center justify-center text-xl shadow"><i class="fa-solid fa-caret-left"></i></button> <!-- RTL mapping -->
                <div></div>
                <button id="btn-down" class="bg-slate-800 active:bg-cyan-600 text-slate-200 rounded-lg flex items-center justify-center text-xl shadow"><i class="fa-solid fa-caret-down"></i></button>
                <div></div>
            </div>

            <!-- Action Buttons Right -->
            <div class="flex gap-3 items-center">
                <button id="btn-action-b" class="w-14 h-14 rounded-full bg-slate-800 active:bg-amber-500 text-amber-400 font-bold text-lg shadow border border-amber-500/30 flex items-center justify-center">B</button>
                <button id="btn-action-a" class="w-16 h-16 rounded-full bg-cyan-600 active:bg-cyan-400 text-slate-950 font-black text-xl shadow-lg shadow-cyan-500/30 flex items-center justify-center">A</button>
            </div>
        </div>
    </div>

    <!-- Application JavaScript Engine -->
    <script>
        // Synthesized Audio System (No external media dependency)
        class SoundEngine {
            constructor() {
                this.enabled = true;
                this.ctx = null;
            }
            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
            }
            playTone(freq, type = 'sine', duration = 0.1, gainVal = 0.1) {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e){}
            }
            playClick() { this.playTone(600, 'sine', 0.05, 0.05); }
            playScore() { this.playTone(880, 'triangle', 0.15, 0.1); }
            playHit() { this.playTone(150, 'sawtooth', 0.2, 0.15); }
            playWin() { 
                this.playTone(523, 'sine', 0.1, 0.1);
                setTimeout(() => this.playTone(659, 'sine', 0.1, 0.1), 100);
                setTimeout(() => this.playTone(783, 'sine', 0.2, 0.1), 200);
            }
            toggleSound() {
                this.enabled = !this.enabled;
                const btn = document.getElementById('sound-toggle-btn');
                btn.innerHTML = this.enabled 
                    ? '<i class="fa-solid fa-volume-high text-lg"></i>' 
                    : '<i class="fa-solid fa-volume-xmark text-lg text-rose-500"></i>';
            }
        }
        const sound = new SoundEngine();

        // Games Catalog Data Definition
        const GAMES_LIST = [
            { id: 'snake', name: 'Snake Deluxe', icon: 'fa-dragon', color: 'from-emerald-500 to-teal-700', cat: 'arcade', desc: 'لعبة الثعبان الكلاسيكية مع عناصر الطاقة السرعة والنمو.' },
            { id: 'flappy', name: 'Flappy Flight', icon: 'fa-crow', color: 'from-amber-500 to-orange-600', cat: 'arcade', desc: 'حلق عبر الأنابيب دون اصطدام بلمسة واحدة.' },
            { id: 'space', name: 'Space Defender', icon: 'fa-shuttle-space', color: 'from-indigo-600 to-purple-800', cat: 'action', desc: 'دمر سفن الأعداء والنيزك في الفضاء الخارجي.' },
            { id: 'breakout', name: 'Brick Breaker', icon: 'fa-border-all', color: 'from-rose-500 to-red-700', cat: 'arcade', desc: 'حطم جميع القوالب الملونة بالكرة والمضرب.' },
            { id: 'g2048', name: '2048 Puzzle', icon: 'fa-cubes', color: 'from-yellow-500 to-amber-700', cat: 'puzzle', desc: 'دمج الأرقام المتشابهة للوصول إلى الرقم 2048.' },
            { id: 'tictactoe', name: 'Tic Tac Toe AI', icon: 'fa-xmark', color: 'from-cyan-500 to-blue-700', cat: 'classic', desc: 'لعبة XO الشهيرة ضد الذكاء الاصطناعي الذكي.' },
            { id: 'memory', name: 'Memory Cards', icon: 'fa-brain', color: 'from-fuchsia-500 to-pink-700', cat: 'puzzle', desc: 'اختبر قوة ذاكرتك بطابق البطاقات المتشابهة.' },
            { id: 'runner', name: 'Dino Runner', icon: 'fa-person-running', color: 'from-green-600 to-emerald-800', cat: 'arcade', desc: 'اقفز فوق العقبات والصبّار باحترافية.' },
            { id: 'mole', name: 'Whack A Mole', icon: 'fa-hammer', color: 'from-amber-600 to-stone-700', cat: 'action', desc: 'اصطد السناجب الخارجة من الحفر بسرعة.' },
            { id: 'pong', name: 'Pong Classic', icon: 'fa-table-tennis-paddle-ball', color: 'from-slate-600 to-slate-800', cat: 'classic', desc: 'كرة الطاولة الكلاسيكية ضد الكمبيوتر.' },
            { id: 'mines', name: 'Minesweeper', icon: 'fa-land-mine-on', color: 'from-red-600 to-slate-800', cat: 'puzzle', desc: 'اكشف مربعات الألغام وتجنب الانفجار.' },
            { id: 'simon', name: 'Simon Says', icon: 'fa-lightbulb', color: 'from-teal-500 to-cyan-700', cat: 'puzzle', desc: 'تذكر النغمة والألوان بالترتيب الصحيح.' },
            { id: 'connect4', name: 'Connect 4', icon: 'fa-circle-dot', color: 'from-blue-600 to-indigo-800', cat: 'classic', desc: 'أسقط أقراصك وشكل خطاً من 4 قطع متتالية.' },
            { id: 'colorswitch', name: 'Color Switch', icon: 'fa-palette', color: 'from-violet-500 to-purple-800', cat: 'arcade', desc: 'اقفز بالكرة عبر الموانع المطابقة للونها.' },
            { id: 'asteroids', name: 'Asteroid Dodge', icon: 'fa-meteor', color: 'from-orange-600 to-amber-800', cat: 'action', desc: 'تفادى الكويكبات النازلة في رحلة فضائية.' },
            { id: 'mathrush', name: 'Math Speed Rush', icon: 'fa-calculator', color: 'from-emerald-600 to-teal-800', cat: 'puzzle', desc: 'حل المعادلات الرياضية قبل انتهاء الوقت.' },
            { id: 'archery', name: 'Archery Target', icon: 'fa-bullseye', color: 'from-rose-600 to-pink-800', cat: 'action', desc: 'اضبط القوس والسهم نحو الهدف بدقة.' },
            { id: 'rps', name: 'RPS Extreme', icon: 'fa-hand-fist', color: 'from-sky-500 to-indigo-700', cat: 'classic', desc: 'حجرة ورقة مقص التكتيكية المتقدمة.' },
            { id: 'pinball', name: 'Bouncing Pinball', icon: 'fa-bowling-ball', color: 'from-yellow-600 to-amber-800', cat: 'arcade', desc: 'لعبة البينبول وتجميع النقاط المرتفعة.' },
            { id: 'emojiwordle', name: 'Emoji Wordle', icon: 'fa-icons', color: 'from-purple-600 to-fuchsia-800', cat: 'puzzle', desc: 'خمن الشفرة السرية للإيموجي في 6 محاولات.' },
            { id: 'maze', name: 'Maze Runner', icon: 'fa-compass', color: 'from-teal-600 to-emerald-900', cat: 'puzzle', desc: 'اعثر على المخرج داخل المتاهة العشوائية.' }
        ];

        // Global App Manager
        class App {
            constructor() {
                this.activeCategory = 'all';
                this.searchQuery = '';
                this.activeGameId = null;
                this.currentGameInstance = null;
                this.scores = JSON.parse(localStorage.getItem('21_games_scores') || '{}');
            }

            init() {
                this.renderGamesGrid();
                this.updateTotalScoreBadge();
                this.bindControls();
                // Auto show touch controls on touch devices
                if ('ontouchstart' in window) {
                    document.getElementById('touch-controls').classList.remove('hidden');
                }
            }

            renderGamesGrid() {
                const grid = document.getElementById('games-grid');
                grid.innerHTML = '';

                const filtered = GAMES_LIST.filter(g => {
                    const matchesCat = this.activeCategory === 'all' || g.cat === this.activeCategory;
                    const matchesSearch = g.name.toLowerCase().includes(this.searchQuery.toLowerCase()) || g.desc.includes(this.searchQuery);
                    return matchesCat && matchesSearch;
                });

                if(filtered.length === 0) {
                    grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500">لا توجد ألعاب مطابقة لبحثك</div>`;
                    return;
                }

                filtered.forEach(game => {
                    const highScore = this.scores[game.id] || 0;
                    const card = document.createElement('div');
                    card.className = 'glass-panel rounded-2xl p-4 flex flex-col justify-between card-hover cursor-pointer border border-slate-800/80 group relative overflow-hidden';
                    card.onclick = () => this.launchGame(game.id);

                    card.innerHTML = `
                        <div class="absolute -top-10 -left-10 w-24 h-24 bg-gradient-to-br ${game.color} opacity-20 rounded-full blur-xl group-hover:opacity-40 transition"></div>
                        <div>
                            <div class="w-12 h-12 rounded-xl bg-gradient-to-tr ${game.color} flex items-center justify-center text-white text-xl mb-3 shadow-md">
                                <i class="fa-solid ${game.icon}"></i>
                            </div>
                            <h3 class="font-bold text-slate-100 text-sm mb-1 group-hover:text-cyan-400 transition">${game.name}</h3>
                            <p class="text-xs text-slate-400 line-clamp-2 mb-3">${game.desc}</p>
                        </div>
                        <div class="flex items-center justify-between text-xs text-slate-400 border-t border-slate-800/60 pt-2.5 mt-auto">
                            <span><i class="fa-solid fa-trophy text-amber-400 ml-1"></i> ${highScore}</span>
                            <span class="text-cyan-400 font-semibold group-hover:translate-x-[-2px] transition">العب <i class="fa-solid fa-play text-[10px]"></i></span>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            }

            setCategory(cat) {
                this.activeCategory = cat;
                document.querySelectorAll('.cat-btn').forEach(btn => {
                    btn.classList.remove('bg-cyan-500', 'text-slate-950', 'active');
                    btn.classList.add('bg-slate-900', 'text-slate-400');
                });
                event.target.classList.remove('bg-slate-900', 'text-slate-400');
                event.target.classList.add('bg-cyan-500', 'text-slate-950', 'active');
                this.renderGamesGrid();
            }

            filterGames() {
                this.searchQuery = document.getElementById('game-search').value;
                this.renderGamesGrid();
            }

            launchGame(id) {
                sound.playClick();
                this.activeGameId = id;
                const gameInfo = GAMES_LIST.find(g => g.id === id);
                document.getElementById('active-game-title').innerText = gameInfo.name;
                document.getElementById('current-score').innerText = '0';
                document.getElementById('high-score').innerText = this.scores[id] || 0;

                document.getElementById('dashboard-view').classList.add('hidden');
                document.getElementById('game-view').classList.remove('hidden');

                const stage = document.getElementById('game-stage');
                stage.innerHTML = '';

                // Instantiate specific game class
                if (gameInstances[id]) {
                    this.currentGameInstance = new gameInstances[id](stage, (score) => this.onScoreUpdate(score));
                    this.currentGameInstance.start();
                }
            }

            onScoreUpdate(score) {
                document.getElementById('current-score').innerText = score;
                const currentHigh = this.scores[this.activeGameId] || 0;
                if (score > currentHigh) {
                    this.scores[this.activeGameId] = score;
                    document.getElementById('high-score').innerText = score;
                    localStorage.setItem('21_games_scores', JSON.stringify(this.scores));
                    this.updateTotalScoreBadge();
                }
            }

            updateTotalScoreBadge() {
                const total = Object.values(this.scores).reduce((a, b) => a + b, 0);
                document.getElementById('total-score-badge').innerText = total;
            }

            restartActiveGame() {
                sound.playClick();
                if (this.currentGameInstance) {
                    this.currentGameInstance.destroy();
                    this.launchGame(this.activeGameId);
                }
            }

            closeGame() {
                sound.playClick();
                if (this.currentGameInstance) {
                    this.currentGameInstance.destroy();
                    this.currentGameInstance = null;
                }
                document.getElementById('game-view').classList.add('hidden');
                document.getElementById('dashboard-view').classList.remove('hidden');
                this.renderGamesGrid();
            }

            showDashboard() {
                if (!document.getElementById('game-view').classList.contains('hidden')) {
                    this.closeGame();
                }
            }

            toggleVirtualController() {
                const controls = document.getElementById('touch-controls');
                controls.classList.toggle('hidden');
            }

            toggleFullscreen() {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(()=>{});
                } else {
                    if (document.exitFullscreen) document.exitFullscreen();
                }
            }

            bindControls() {
                const triggerKey = (type, keyName) => {
                    if (this.currentGameInstance && this.currentGameInstance.handleInput) {
                        this.currentGameInstance.handleInput(type, keyName);
                    }
                };

                const bindBtn = (elementId, keyName) => {
                    const btn = document.getElementById(elementId);
                    if (!btn) return;
                    btn.addEventListener('touchstart', (e) => { e.preventDefault(); triggerKey('down', keyName); });
                    btn.addEventListener('touchend', (e) => { e.preventDefault(); triggerKey('up', keyName); });
                    btn.addEventListener('mousedown', () => triggerKey('down', keyName));
                    btn.addEventListener('mouseup', () => triggerKey('up', keyName));
                };

                bindBtn('btn-up', 'ArrowUp');
                bindBtn('btn-down', 'ArrowDown');
                bindBtn('btn-left', 'ArrowLeft');
                bindBtn('btn-right', 'ArrowRight');
                bindBtn('btn-action-a', 'Space');
                bindBtn('btn-action-b', 'KeyZ');

                window.addEventListener('keydown', (e) => {
                    if (this.currentGameInstance && this.currentGameInstance.handleInput) {
                        this.currentGameInstance.handleInput('down', e.code);
                    }
                });
                window.addEventListener('keyup', (e) => {
                    if (this.currentGameInstance && this.currentGameInstance.handleInput) {
                        this.currentGameInstance.handleInput('up', e.code);
                    }
                });
            }
        }

        // Helper Canvas Creator
        function createStandardCanvas(container, width = 600, height = 600) {
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            canvas.className = 'max-w-full max-h-full object-contain rounded-xl border border-slate-800 shadow-2xl bg-slate-900';
            container.appendChild(canvas);

                if(type !== 'down') return;
                if ((key === 'ArrowUp' || key === 'KeyW') && this.dy !== 1) { this.dx = 0; this.dy = -1; }

        // 5. 2048 Puzzle
        gameInstances['g2048'] = class {
            constructor(container, onScore) {
                this.container = container;
                this.onScore = onScore;
                this.grid = Array(4).fill(0).map(() => Array(4).fill(0));
                this.score = 0;
                this.buildUI();
                this.addTile();
                this.addTile();
                this.updateUI();
            }
            buildUI() {
                this.container.innerHTML = `<div id="grid-2048" class="grid grid-cols-4 gap-3 bg-slate-900 p-4 rounded-2xl w-80 h-80 shadow-2xl border border-slate-800"></div>`;
            }
            addTile() {
                let empty = [];
                for (let r = 0; r < 4; r++)
                    for (let c = 0; c < 4; c++)
                        if (this.grid[r][c] === 0) empty.push({ r, c });
                if (empty.length > 0) {
                    let spot = empty[Math.floor(Math.random() * empty.length)];
                    this.grid[spot.r][spot.c] = Math.random() > 0.1 ? 2 : 4;
                }
            }
            start() {}
            handleInput(type, key) {
                if (type !== 'down') return;
                let moved = false;
                if (key === 'ArrowLeft') moved = this.slideLeft();
                if (key === 'ArrowRight') moved = this.slideRight();
                if (key === 'ArrowUp') moved = this.slideUp();
                if (key === 'ArrowDown') moved = this.slideDown();

                if (moved) {
                    sound.playScore();
                    this.addTile();
                    this.updateUI();
                    this.onScore(this.score);
                }
            }
            slideLeft() {
                let moved = false;
                for (let r = 0; r < 4; r++) {
                    let row = this.grid[r].filter(v => v !== 0);
                    for (let c = 0; c < row.length - 1; c++) {
                        if (row[c] === row[c + 1]) {
                            row[c] *= 2;
                            this.score += row[c];
                            row.splice(c + 1, 1);
                        }
                    }
                    while (row.length < 4) row.push(0);
                    if (JSON.stringify(this.grid[r]) !== JSON.stringify(row)) moved = true;
                    this.grid[r] = row;
                }
                return moved;
            }
            slideRight() {
                this.grid.forEach(r => r.reverse());
                let moved = this.slideLeft();
                this.grid.forEach(r => r.reverse());
                return moved;
            }
            slideUp() {
                this.transpose();
                let moved = this.slideLeft();
                this.transpose();
                return moved;
            }
            slideDown() {
                this.transpose();
                let moved = this.slideRight();
                this.transpose();
                return moved;
            }
            transpose() {
                for (let r = 0; r < 4; r++) {
                    for (let c = r + 1; c < 4; c++) {
                        [this.grid[r][c], this.grid[c][r]] = [this.grid[c][r], this.grid[r][c]];
                    }
                }
            }
            updateUI() {
                const el = document.getElementById('grid-2048');
                if(!el) return;
                el.innerHTML = '';
                for (let r = 0; r < 4; r++) {
                    for (let c = 0; c < 4; c++) {
                        const val = this.grid[r][c];
                        const tile = document.createElement('div');
                        tile.className = `flex items-center justify-center rounded-xl text-lg font-black transition-all ${val === 0 ? 'bg-slate-800/40' : 'bg-gradient-to-tr from-cyan-500 to-fuchsia-600 text-slate-950 shadow-lg'}`;
                        tile.innerText = val > 0 ? val : '';
                        el.appendChild(tile);
                    }
                }
            }
            destroy() {}
        };

            }
            render() {
                const grid = document.getElementById('ttt-grid');
                if (!grid) return;
                grid.innerHTML = '';
                this.board.forEach((val, idx) => {
                    const btn = document.createElement('button');
                    btn.className = 'bg-slate-800 hover:bg-slate-700 text-3xl font-extrabold rounded-xl flex items-center justify-center text-cyan-400 border border-slate-700/50';
                    btn.innerText = val || '';
                    btn.onclick = () => this.makeMove(idx);
                    grid.appendChild(btn);
                });
            }
            makeMove(i) {
                if (this.board[i] || this.checkWinner()) return;
                this.board[i] = 'X';
                sound.playClick();
                if (!this.checkWinner() && this.board.includes(null)) {
                    // Smart AI Move
                    let emptyIndices = this.board.map((v, idx) => v === null ? idx : null).filter(v => v !== null);
                    let aiChoice = emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
                    this.board[aiChoice] = 'O';
                }
                this.render();
                const winner = this.checkWinner();
                if (winner === 'X') {
                    this.score += 100;
                    this.onScore(this.score);
                    sound.playWin();
                }
            }
            checkWinner() {
                const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
                for (let [a,b,c] of lines) {
                    if (this.board[a] && this.board[a] === this.board[b] && this.board[a] === this.board[c]) return this.board[a];
                }

                loop();
            }
            handleInput(type, key) {
                const isDown = type === 'down';
                if (key === 'ArrowUp' || key === 'KeyW') this.moveUp = isDown;
                if (key === 'ArrowDown' || key === 'KeyS') this.moveDown = isDown;
            }
            update() {
                if (this.moveUp && this.py > 0) this.py -= 5;
                if (this.moveDown && this.py < 280) this.py += 5;

                // AI tracking ball
                this.aiY += (this.ball.y - (this.aiY + 35)) * 0.08;

                this.ball.x += this.ball.dx;
                this.ball.y += this.ball.dy;

                if (this.ball.y < 5 || this.ball.y > 345) this.ball.dy *= -1;

                // Player paddle hit
                if (this.ball.x <= 25 && this.ball.y >= this.py && this.ball.y <= this.py + 70) {
                    this.ball.dx = Math.abs(this.ball.dx) + 0.2;
                    sound.playTone(300, 'sine', 0.05);
                }

                // AI paddle hit
                if (this.ball.x >= 475 && this.ball.y >= this.aiY && this.ball.y <= this.aiY + 70) {
                    this.ball.dx = -Math.abs(this.ball.dx) - 0.2;
                }

                if (this.ball.x < 0) {
                    sound.playHit();
                    this.ball = { x: 250, y: 175, dx: 4, dy: 3 };
                    this.score = 0; this.onScore(0);
                }
                if (this.ball.x > 500) {
                    sound.playScore();
                    this.score += 1; this.onScore(this.score);
                    this.ball = { x: 250, y: 175, dx: -4, dy: 3 };
                }
            }
            draw() {
                this.ctx.fillStyle = '#0b0f19';
                this.ctx.fillRect(0, 0, 500, 350);
                // Paddles
                this.ctx.fillStyle = '#00f3ff';
                this.ctx.fillRect(10, this.py, 12, 70);
                this.ctx.fillStyle = '#ff0055';
                this.ctx.fillRect(478, this.aiY, 12, 70);
                // Ball
                this.ctx.fillStyle = '#ffffff';
                this.ctx.fillRect(this.ball.x - 5, this.ball.y - 5, 10, 10);
            }
            destroy() { cancelAnimationFrame(this.anim); }
        };

        // 11. Minesweeper
        gameInstances['mines'] = class {
            constructor(container, onScore) {
                this.container = container;
                this.onScore = onScore;
                this.size = 8;
                this.minesCount = 8;
                this.board = [];
                this.score = 0;
                this.initBoard();
                this.buildUI();
            }
            initBoard() {
                this.board = Array(this.size).fill(0).map(() => Array(this.size).fill(0).map(() => ({ mine: false, revealed: false, count: 0 })));
                let m = 0;
                while (m < this.minesCount) {
                    let r = Math.floor(Math.random() * this.size);
                    let c = Math.floor(Math.random() * this.size);
                    if (!this.board[r][c].mine) {
                        this.board[r][c].mine = true;
                        m++;
                    }
                }
            }
            buildUI() {
                this.container.innerHTML = `<div id="mine-grid" class="grid grid-cols-8 gap-1.5 w-80 bg-slate-900 p-3 rounded-2xl border border-slate-800"></div>`;
                this.render();
            }
            render() {
                const grid = document.getElementById('mine-grid');
                if(!grid) return;
                grid.innerHTML = '';
                for(let r=0; r<this.size; r++) {
                    for(let c=0; c<this.size; c++) {
                        const cell = this.board[r][c];
                        const btn = document.createElement('button');
                        btn.className = `w-8 h-8 rounded text-xs font-bold transition-all ${cell.revealed ? 'bg-slate-800 text-cyan-400' : 'bg-slate-700 hover:bg-slate-600 text-transparent'}`;
                        btn.innerText = cell.revealed ? (cell.mine ? '💣' : cell.count || '') : '?';
                        btn.onclick = () => this.reveal(r, c);
                        grid.appendChild(btn);
                    }
                }
            }
            reveal(r, c) {
                if (this.board[r][c].revealed) return;
                this.board[r][c].revealed = true;
                if (this.board[r][c].mine) {
                    sound.playHit();
                    alert('انفجر اللغم! حظاً سعيداً في المرة القادمة.');
                    this.initBoard();
                } else {
                    sound.playClick();
                    this.score += 10;
                    this.onScore(this.score);
                }
                this.render();
            }
            start() {}
            destroy() {}
        };

        // 12. Simon Says
        gameInstances['simon'] = class {
            constructor(container, onScore) {
                this.container = container;
                this.onScore = onScore;
                this.sequence = [];
                this.userSeq = [];
                this.score = 0;
                this.colors = ['#ff0055', '#00f3ff', '#ffe600', '#00ff66'];
                this.buildUI();
            }
            buildUI() {
                this.container.innerHTML = `<div id="simon-grid" class="grid grid-cols-2 gap-4 w-64 h-64 bg-slate-900 p-4 rounded-2xl border border-slate-800"></div>`;
                this.render();
            }
            render() {
                const grid = document.getElementById('simon-grid');
                if(!grid) return;
                grid.innerHTML = '';
                this.colors.forEach((col, idx) => {
                    const btn = document.createElement('button');
                    btn.className = 'rounded-2xl transition-all shadow-lg active:scale-95';
                    btn.style.backgroundColor = col;
                    btn.onclick = () => this.userClick(idx);
                    grid.appendChild(btn);
                });
            }
            start() {
                this.nextRound();
            }
            nextRound() {
                this.userSeq = [];
                this.sequence.push(Math.floor(Math.random() * 4));
                this.playSequence();
            }
            playSequence() {
                let i = 0;
                const interval = setInterval(() => {
                    if (i >= this.sequence.length) { clearInterval(interval); return; }
                    sound.playTone(300 + this.sequence[i] * 100, 'sine', 0.2);
                    i++;
                }, 600);
            }
            userClick(idx) {
                sound.playTone(300 + idx * 100, 'sine', 0.1);
                this.userSeq.push(idx);
                if (this.userSeq[this.userSeq.length - 1] !== this.sequence[this.userSeq.length - 1]) {
                    sound.playHit();
                    this.sequence = [];
                    this.score = 0;
                    this.onScore(0);
                    setTimeout(() => this.nextRound(), 1000);
                    return;
                }
                if (this.userSeq.length === this.sequence.length) {
                    this.score += 25;
                    this.onScore(this.score);
                    sound.playWin();
                    setTimeout(() => this.nextRound(), 1000);
                }
            }
            destroy() {}
        };

        // 13. Connect 4
        gameInstances['connect4'] = class {
            constructor(container, onScore) {
                this.container = container;
                this.onScore = onScore;
                this.grid = Array(6).fill(null).map(() => Array(7).fill(null));
                this.turn = 'red';
                this.score = 0;
                this.buildUI();
            }
            buildUI() {
                this.container.innerHTML = `<div id="c4-grid" class="grid grid-cols-7 gap-2 bg-slate-900 p-4 rounded-2xl border border-slate-800 w-80"></div>`;
                this.render();
            }
            render() {
                const grid = document.getElementById('c4-grid');
                if(!grid) return;
                grid.innerHTML = '';
                for(let r=0; r<6; r++) {
                    for(let c=0; c<7; c++) {
                        const cell = document.createElement('button');
                        const val = this.grid[r][c];
                        cell.className = `w-9 h-9 rounded-full border border-slate-700 ${val === 'red' ? 'bg-rose-500' : val === 'yellow' ? 'bg-amber-400' : 'bg-slate-800'}`;
                        cell.onclick = () => this.drop(c);
                        grid.appendChild(cell);
                    }
                }
            }
            drop(col) {
                for (let r = 5; r >= 0; r--) {
                    if (!this.grid[r][col]) {
                        this.grid[r][col] = 'red';
                        sound.playClick();
                        this.render();
                        // AI turn
                        setTimeout(() => this.aiMove(), 300);
                        return;
                    }
                }
            }
            aiMove() {
                let validCols = [];
                for(let c=0; c<7; c++) if(!this.grid[0][c]) validCols.push(c);
                if(validCols.length === 0) return;
                let c = validCols[Math.floor(Math.random() * validCols.length)];
                for (let r = 5; r >= 0; r--) {
                    if (!this.grid[r][c]) {
                        this.grid[r][c] = 'yellow';
                        this.render();
                        return;
                    }
                }
            }
            start() {}
            destroy() {}
        };

        // 14. Color Switch
        gameInstances['colorswitch'] = class {
            constructor(container, onScore) {
                this.canvas = createStandardCanvas(container, 400, 500);
                this.ctx = this.canvas.getContext('2d');
                this.onScore = onScore;
                this.ballY = 400; this.vy = 0;
                this.colors = ['#00f3ff', '#ff00ff', '#ffe600', '#00ff66'];
                this.ballColor = this.colors[0];
                this.score = 0;
                this.anim = null;
            }
            start() {
                const loop = () => {
                    this.update();
                    this.draw();
                    this.anim = requestAnimationFrame(loop);
                };
                loop();
            }
            handleInput(type, key) {
                if (type === 'down' && (key === 'Space' || key === 'ArrowUp')) {
                    this.vy = -6;
                    sound.playTone(450, 'sine', 0.05);
                }
            }
            update() {
                this.vy += 0.25;
                this.ballY += this.vy;
                if (this.ballY > 480) {
                    this.ballY = 400; this.vy = 0;
                    this.score = 0; this.onScore(0);
                    sound.playHit();
                }
            }
            draw() {
                this.ctx.fillStyle = '#0b0f19';
                this.ctx.fillRect(0, 0, 400, 500);
                // Rotating Ring Simulation
                this.ctx.strokeStyle = '#00f3ff';
                this.ctx.lineWidth = 10;
                this.ctx.beginPath();
                this.ctx.arc(200, 200, 60, 0, Math.PI * 2);
                this.ctx.stroke();
                // Ball
                this.ctx.fillStyle = this.ballColor;
                this.ctx.beginPath();
                this.ctx.arc(200, this.ballY, 12, 0, Math.PI * 2);
                this.ctx.fill();
            }
            destroy() { cancelAnimationFrame(this.anim); }
        };

        // 15. Asteroid Dodge
        gameInstances['asteroids'] = class {
            constructor(container, onScore) {
                this.canvas = createStandardCanvas(container, 400, 500);
                this.ctx = this.canvas.getContext('2d');
                this.onScore = onScore;
                this.px = 180;
                this.asteroids = [];
                this.score = 0;
                this.frame = 0;
                this.anim = null;
                this.moveLeft = false; this.moveRight = false;
            }
            start() {
                const loop = () => {
                    this.update();
                    this.draw();
                    this.anim = requestAnimationFrame(loop);
                };
                loop();
            }
            handleInput(type, key) {
                const isDown = type === 'down';
                if (key === 'ArrowLeft' || key === 'KeyA') this.moveLeft = isDown;
                if (key === 'ArrowRight' || key === 'KeyD') this.moveRight = isDown;
            }
            update() {
                this.frame++;
                if (this.moveLeft && this.px > 0) this.px -= 5;
                if (this.moveRight && this.px < 360) this.px += 5;

                if (this.frame % 30 === 0) {
                    this.asteroids.push({ x: Math.random() * 360, y: -20, r: Math.random() * 15 + 10 });
                }

                this.asteroids.forEach(a => a.y += 4);

                // Collision
                this.asteroids.forEach(a => {
                    if (Math.hypot(a.x - (this.px + 20), a.y - 450) < a.r + 15) {
                        sound.playHit();
                        this.score = 0; this.onScore(0);
                        this.asteroids = [];
                    }
                });

                if (this.frame % 15 === 0) {
                    this.score += 5; this.onScore(this.score);
                }
            }
            draw() {
                this.ctx.fillStyle = '#070a12';
                this.ctx.fillRect(0, 0, 400, 500);
                // Ship
                this.ctx.fillStyle = '#00f3ff';
                this.ctx.fillRect(this.px, 440, 40, 20);
                // Asteroids
                this.ctx.fillStyle = '#94a3b8';
                this.asteroids.forEach(a => {
                    this.ctx.beginPath();
                    this.ctx.arc(a.x, a.y, a.r, 0, Math.PI * 2);
                    this.ctx.fill();
                });
            }
            destroy() { cancelAnimationFrame(this.anim); }
        };

        // 16. Math Speed Rush
        gameInstances['mathrush'] = class {
            constructor(container, onScore) {
                this.container = container;
                this.onScore = onScore;
                this.score = 0;
                this.buildUI();
                this.generateProblem();
            }
            buildUI() {
                this.container.innerHTML = `
                    <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 text-center w-80 shadow-2xl">
                        <div id="math-eq" class="text-3xl font-black text-cyan-400 mb-6">? + ?</div>
                        <div id="math-opts" class="grid grid-cols-2 gap-3"></div>
                    </div>
                `;
            }
            generateProblem() {
                const a = Math.floor(Math.random() * 20) + 1;
                const b = Math.floor(Math.random() * 20) + 1;
                const ans = a + b;
                const eqEl = document.getElementById('math-eq');
                if(!eqEl) return;
                eqEl.innerText = `${a} + ${b} = ?`;

                const optsEl = document.getElementById('math-opts');
                optsEl.innerHTML = '';
                const opts = [ans, ans + 2, ans - 3, ans + 5].sort(() => Math.random() - 0.5);

                opts.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'bg-slate-800 hover:bg-slate-700 py-3 rounded-xl font-bold text-lg text-slate-200 border border-slate-700';
                    btn.innerText = opt;
                    btn.onclick = () => {
                        if (opt === ans) {
                            sound.playScore();
                            this.score += 20;
                            this.onScore(this.score);
                        } else {
                            sound.playHit();
                        }
                        this.generateProblem();
                    };
                    optsEl.appendChild(btn);
                });
            }
            start() {}
            destroy() {}
        };

        // 17. Archery Target
        gameInstances['archery'] = class {
            constructor(container, onScore) {
                this.canvas = createStandardCanvas(container, 500, 350);
                this.ctx = this.canvas.getContext('2d');
                this.onScore = onScore;
                this.targetY = 100; this.dir = 1.5;
                this.arrow = null;
                this.score = 0;
                this.anim = null;
            }
            start() {
                const loop = () => {
                    this.update();
                    this.draw();
                    this.anim = requestAnimationFrame(loop);
                };
                loop();
            }
            handleInput(type, key) {
                if (type === 'down' && key === 'Space' && !this.arrow) {
                    this.arrow = { x: 50, y: 175 };
                    sound.playTone(600, 'sine', 0.08);
                }
            }
            update() {
                this.targetY += this.dir;
                if (this.targetY < 40 || this.targetY > 260) this.dir *= -1;

                if (this.arrow) {
                    this.arrow.x += 12;
                    if (this.arrow.x >= 420) {
                        const dist = Math.abs(this.arrow.y - (this.targetY + 40));
                        if (dist < 40) {
                            sound.playScore();
                            this.score += 50 - Math.floor(dist);
                            this.onScore(this.score);
                        } else {
                            sound.playHit();
                        }
                        this.arrow = null;
                    }
                }
            }
            draw() {
                this.ctx.fillStyle = '#0b0f19';
                this.ctx.fillRect(0, 0, 500, 350);
                // Target
                this.ctx.fillStyle = '#ff0055';
                this.ctx.fillRect(430, this.targetY, 20, 80);
                // Arrow
                if (this.arrow) {
                    this.ctx.fillStyle = '#ffe600';
                    this.ctx.fillRect(this.arrow.x, this.arrow.y, 25, 4);
                }
            }
            destroy() { cancelAnimationFrame(this.anim); }
        };

        // 18. Rock Paper Scissors Extreme
        gameInstances['rps'] = class {
            constructor(container, onScore) {
                this.container = container;
                this.onScore = onScore;
                this.score = 0;
                this.choices = [
                    { name: 'حجر ✊', beats: 'قص' },
                    { name: 'ورقة ✋', beats: 'حجر' },
                    { name: 'قص ✌️', beats: 'ورقة' }
                ];
                this.buildUI();
            }
            buildUI() {
                this.container.innerHTML = `
                    <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 text-center w-80 shadow-2xl">
                        <div id="rps-res" class="text-lg font-bold text-cyan-400 mb-6">اختر حركتك!</div>
                        <div class="flex justify-center gap-3">
                            ${this.choices.map((c, i) => `<button onclick="app.currentGameInstance.play(${i})" class="bg-slate-800 hover:bg-cyan-600 text-2xl p-4 rounded-xl border border-slate-700 transition">${c.name.split(' ')[1]}</button>`).join('')}
                        </div>
                    </div>
                `;
            }
            play(i) {
                const ai = Math.floor(Math.random() * 3);
                const pChoice = this.choices[i];
                const aiChoice = this.choices[ai];

                const resEl = document.getElementById('rps-res');
                if (pChoice.name === aiChoice.name) {
                    resEl.innerText = `تعادل! كلاكما اختار ${pChoice.name}`;
                } else if (pChoice.beats === aiChoice.name.split(' ')[0]) {
                    sound.playScore();
                    this.score += 30;
                    this.onScore(this.score);
                    resEl.innerText = `فزت! ${pChoice.name} يهزم ${aiChoice.name}`;
                } else {
                    sound.playHit();
                    resEl.innerText = `خسرت! ${aiChoice.name} يهزم ${pChoice.name}`;
                }
            }
            start() {}
            destroy() {}
        };

        // 19. Bouncing Pinball
        gameInstances['pinball'] = class {
            constructor(container, onScore) {
                this.canvas = createStandardCanvas(container, 400, 500);
                this.ctx = this.canvas.getContext('2d');
                this.onScore = onScore;
                this.ball = { x: 200, y: 300, vx: 3, vy: -5 };
                this.score = 0;
                this.anim = null;
            }
            start() {
                const loop = () => {
                    this.update();
                    this.draw();
                    this.anim = requestAnimationFrame(loop);
                };
                loop();
            }
            update() {
                this.ball.x += this.ball.vx;
                this.ball.y += this.ball.vy;
                this.ball.vy += 0.15; // Gravity

                if (this.ball.x < 10 || this.ball.x > 390) this.ball.vx *= -1;
                if (this.ball.y < 10) this.ball.vy *= -1;

                // Bumper
                if (Math.hypot(this.ball.x - 200, this.ball.y - 150) < 30) {
                    this.ball.vy *= -1.1;
                    sound.playScore();
                    this.score += 25; this.onScore(this.score);
                }

                if (this.ball.y > 500) {
                    sound.playHit();
                    this.ball = { x: 200, y: 200, vx: 3, vy: -5 };
                    this.score = 0; this.onScore(0);
                }
            }
            draw() {
                this.ctx.fillStyle = '#0b0f19';
                this.ctx.fillRect(0, 0, 400, 500);
                // Bumper
                this.ctx.fillStyle = '#ff00ff';
                this.ctx.beginPath();
                this.ctx.arc(200, 150, 25, 0, Math.PI * 2);
                this.ctx.fill();
                // Ball
                this.ctx.fillStyle = '#00f3ff';
                this.ctx.beginPath();
                this.ctx.arc(this.ball.x, this.ball.y, 8, 0, Math.PI * 2);
                this.ctx.fill();
            }
            destroy() { cancelAnimationFrame(this.anim); }
        };

        // 20. Emoji Wordle
        gameInstances['emojiwordle'] = class {
            constructor(container, onScore) {
                this.container = container;
                this.onScore = onScore;
                this.secret = ['🚀', '⭐', '🔥'];
                this.guess = [];
                this.score = 0;
                this.buildUI();
            }
            buildUI() {
                this.container.innerHTML = `
                    <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 text-center w-80 shadow-2xl">
                        <div id="wordle-grid" class="flex justify-center gap-2 mb-6 text-3xl h-12"></div>
                        <div class="flex justify-center gap-2">
                            ${['🚀', '⭐', '🔥', '💎', '⚡'].map(e => `<button onclick="app.currentGameInstance.add('${e}')" class="bg-slate-800 p-3 text-2xl rounded-xl border border-slate-700">${e}</button>`).join('')}
                        </div>
                    </div>
                `;
            }
            add(emoji) {
                if (this.guess.length < 3) {
                    sound.playClick();
                    this.guess.push(emoji);
                    const el = document.getElementById('wordle-grid');
                    if(el) el.innerText = this.guess.join(' ');

                    if (this.guess.length === 3) {
                        if (JSON.stringify(this.guess) === JSON.stringify(this.secret)) {
                            sound.playWin();
                            this.score += 100;
                            this.onScore(this.score);
                            alert('مبروك! خمنت الشفرة الصحيحة.');
                        } else {
                            sound.playHit();
                        }
                        this.guess = [];
                    }
                }
            }
            start() {}
            destroy() {}
        };

        // 21. Maze Runner
        gameInstances['maze'] = class {
            constructor(container, onScore) {
                this.canvas = createStandardCanvas(container, 400, 400);
                this.ctx = this.canvas.getContext('2d');
                this.onScore = onScore;
                this.px = 0; this.py = 0;
                this.score = 0;
                this.gridSize = 10;
                this.anim = null;
            }
            start() {
                this.draw();
            }
            handleInput(type, key) {
                if (type !== 'down') return;
                if (key === 'ArrowRight' && this.px < 9) this.px++;
                if (key === 'ArrowLeft' && this.px > 0) this.px--;
                if (key === 'ArrowDown' && this.py < 9) this.py++;
                if (key === 'ArrowUp' && this.py > 0) this.py--;

                sound.playClick();
                if (this.px === 9 && this.py === 9) {
                    sound.playWin();
                    this.score += 100;
                    this.onScore(this.score);
                    this.px = 0; this.py = 0;
                }
                this.draw();
            }
            draw() {
                this.ctx.fillStyle = '#0b0f19';
                this.ctx.fillRect(0, 0, 400, 400);

                // Grid lines
                this.ctx.strokeStyle = '#1e293b';
                for(let i=0; i<=10; i++) {
                    this.ctx.beginPath(); this.ctx.moveTo(i*40, 0); this.ctx.lineTo(i*40, 400); this.ctx.stroke();
                    this.ctx.beginPath(); this.ctx.moveTo(0, i*40); this.ctx.lineTo(400, i*40); this.ctx.stroke();
                }

                // Target Exit
                this.ctx.fillStyle = '#00ff66';
                this.ctx.fillRect(360 + 5, 360 + 5, 30, 30);

                // Player
                this.ctx.fillStyle = '#00f3ff';
                this.ctx.fillRect(this.px * 40 + 5, this.py * 40 + 5, 30, 30);
            }
            destroy() {}
        };

        // Initialize Platform App
        const app = new App();
        window.onload = () => {
            app.init();
        };
    </script>
</body>
</html>
