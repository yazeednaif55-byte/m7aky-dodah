        // Web Audio Synthesized Sound Engine
        class SoundEngine {
            constructor() {
                this.enabled = true;
                this.ctx = null;
            }
            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
            }
            playTone(freq, type = 'sine', duration = 0.1, gainVal = 0.1) {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e){}
            }
            playClick() { this.playTone(600, 'sine', 0.05, 0.05); }
            playScore() { this.playTone(880, 'triangle', 0.12, 0.1); }
            playHit() { this.playTone(140, 'sawtooth', 0.2, 0.15); }
            playWin() { 
                this.playTone(523, 'sine', 0.1, 0.1);
                setTimeout(() => this.playTone(659, 'sine', 0.1, 0.1), 90);
                setTimeout(() => this.playTone(783, 'sine', 0.2, 0.1), 180);
            }
            toggleSound() {
                this.enabled = !this.enabled;
                const btn = document.getElementById('sound-toggle-btn');
                btn.innerHTML = this.enabled 
                    ? '<i class="fa-solid fa-volume-high text-lg"></i>' 
                    : '<i class="fa-solid fa-volume-xmark text-lg text-rose-500"></i>';
            }
        }

            { id: 'golf', name: 'Golf Hole-In-One', icon: 'fa-flag-checkered', color: 'from-emerald-500 to-green-700', cat: 'sports', desc: 'سدد الكرة نحو حفرة الجولف بمهارة.' }
        ];

        class App {
            constructor() {
                this.activeCategory = 'all';
                this.searchQuery = '';
                this.activeGameId = null;
                this.currentGameInstance = null;
                this.scores = JSON.parse(localStorage.getItem('51_games_scores') || '{}');
            }

            init() {
                this.renderGamesGrid();
                this.updateTotalScoreBadge();
                this.bindControls();
            }

            renderGamesGrid() {
                const grid = document.getElementById('games-grid');
                grid.innerHTML = '';

                const filtered = GAMES_LIST.filter(g => {
                    const matchesCat = this.activeCategory === 'all' || g.cat === this.activeCategory;
                    const matchesSearch = g.name.toLowerCase().includes(this.searchQuery.toLowerCase()) || g.desc.includes(this.searchQuery);
                    return matchesCat && matchesSearch;
                });

                if(filtered.length === 0) {
                    grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500">لا توجد ألعاب مطابقة لبحثك</div>`;
                    return;
                }

                filtered.forEach(game => {
                    const highScore = this.scores[game.id] || 0;
                    const card = document.createElement('div');
                    card.className = 'glass-panel rounded-2xl p-3.5 flex flex-col justify-between card-hover cursor-pointer border border-slate-800/80 group relative overflow-hidden';
                    card.onclick = () => this.launchGame(game.id);

                    card.innerHTML = `
                        <div class="absolute -top-10 -left-10 w-20 h-20 bg-gradient-to-br ${game.color} opacity-20 rounded-full blur-xl group-hover:opacity-40 transition"></div>
                        <div>
                            <div class="w-11 h-11 rounded-xl bg-gradient-to-tr ${game.color} flex items-center justify-center text-slate-950 text-lg mb-2 shadow-md">
                                <i class="fa-solid ${game.icon}"></i>
                            </div>
                            <h3 class="font-bold text-slate-100 text-xs sm:text-sm mb-1 group-hover:text-cyan-400 transition truncate">${game.name}</h3>
                            <p class="text-[11px] text-slate-400 line-clamp-2 mb-2 leading-tight">${game.desc}</p>
                        </div>
                        <div class="flex items-center justify-between text-xs text-slate-400 border-t border-slate-800/60 pt-2 mt-auto">
                            <span><i class="fa-solid fa-trophy text-amber-400 ml-1"></i> ${highScore}</span>
                            <span class="text-cyan-400 font-semibold text-[11px]">العب <i class="fa-solid fa-play text-[9px]"></i></span>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            }

            setCategory(cat) {
                this.activeCategory = cat;
                document.querySelectorAll('.cat-btn').forEach(btn => {
                    btn.classList.remove('bg-cyan-500', 'text-slate-950', 'active');
                    btn.classList.add('bg-slate-900', 'text-slate-400');
                });
                event.target.classList.remove('bg-slate-900', 'text-slate-400');
                event.target.classList.add('bg-cyan-500', 'text-slate-950', 'active');
                this.renderGamesGrid();
            }

            filterGames() {
                this.searchQuery = document.getElementById('game-search').value;
                this.renderGamesGrid();
            }

            launchGame(id) {
                sound.playClick();
                this.activeGameId = id;
                const gameInfo = GAMES_LIST.find(g => g.id === id);
                document.getElementById('active-game-title').innerText = gameInfo.name;
                document.getElementById('current-score').innerText = '0';
                document.getElementById('high-score').innerText = this.scores[id] || 0;

                document.getElementById('dashboard-view').classList.add('hidden');
                document.getElementById('game-view').classList.remove('hidden');

                const stage = document.getElementById('game-stage');
                stage.innerHTML = '';

                if (gameInstances[id]) {
                    this.currentGameInstance = new gameInstances[id](stage, (score) => this.onScoreUpdate(score));
                    this.currentGameInstance.start();
                } else {
                    stage.innerHTML = `<div class="text-center text-slate-400">جاري تطوير هذه اللعبة...</div>`;
                }
            }

            onScoreUpdate(score) {
                document.getElementById('current-score').innerText = score;
                const currentHigh = this.scores[this.activeGameId] || 0;
                if (score > currentHigh) {
                    this.scores[this.activeGameId] = score;
                    document.getElementById('high-score').innerText = score;
                    localStorage.setItem('51_games_scores', JSON.stringify(this.scores));
                    this.updateTotalScoreBadge();
                }
            }

            updateTotalScoreBadge() {
                const total = Object.values(this.scores).reduce((a, b) => a + b, 0);
                document.getElementById('total-score-badge').innerText = total;
            }

            restartActiveGame() {
                sound.playClick();
                if (this.currentGameInstance) {
                    if (this.currentGameInstance.destroy) this.currentGameInstance.destroy();
                    this.launchGame(this.activeGameId);
                }
            }

            closeGame() {
                sound.playClick();
                if (this.currentGameInstance && this.currentGameInstance.destroy) {
                    this.currentGameInstance.destroy();
                    this.currentGameInstance = null;
                }
                document.getElementById('game-view').classList.add('hidden');
                document.getElementById('dashboard-view').classList.remove('hidden');
                this.renderGamesGrid();
            }

            showDashboard() {
                if (!document.getElementById('game-view').classList.contains('hidden')) {
                    this.closeGame();
                }
            }

            toggleVirtualController() {
                const controls = document.getElementById('touch-controls');
                controls.classList.toggle('hidden');
            }

            toggleFullscreen() {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(()=>{});
                } else {
                    if (document.exitFullscreen) document.exitFullscreen();
                }
            }

            bindControls() {
                const triggerKey = (type, keyName) => {
                    if (this.currentGameInstance && this.currentGameInstance.handleInput) {
                        this.currentGameInstance.handleInput(type, keyName);
                    }
                };

                const bindBtn = (elementId, keyName) => {
                    const btn = document.getElementById(elementId);
                    if (!btn) return;
                    btn.addEventListener('touchstart', (e) => { e.preventDefault(); triggerKey('down', keyName); });
                    btn.addEventListener('touchend', (e) => { e.preventDefault(); triggerKey('up', keyName); });
                    btn.addEventListener('mousedown', () => triggerKey('down', keyName));
                    btn.addEventListener('mouseup', () => triggerKey('up', keyName));
                };

                // DIRECT RIGHT = ArrowRight, DIRECT LEFT = ArrowLeft
                bindBtn('btn-up', 'ArrowUp');
                bindBtn('btn-down', 'ArrowDown');
                bindBtn('btn-left', 'ArrowLeft');
                bindBtn('btn-right', 'ArrowRight');
                bindBtn('btn-action-a', 'Space');
                bindBtn('btn-action-b', 'KeyZ');

                window.addEventListener('keydown', (e) => {
                    if (this.currentGameInstance && this.currentGameInstance.handleInput) {
                        this.currentGameInstance.handleInput('down', e.code);
                    }
                });
                window.addEventListener('keyup', (e) => {
                    if (this.currentGameInstance && this.currentGameInstance.handleInput) {
                        this.currentGameInstance.handleInput('up', e.code);
                    }
                });
            }
        }

        // Canvas Factory Helper
        function createStandardCanvas(container, width = 500, height = 500) {
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            canvas.className = 'max-w-full max-h-full object-contain rounded-xl border border-slate-800 shadow-2xl bg-slate-900';
            container.appendChild(canvas);
            return canvas;
        }

        const gameInstances = {};

        // 1. Snake Classic
        gameInstances['snake'] = class {
            constructor(c, onS) {
                this.canvas = createStandardCanvas(c, 500, 500);
                this.ctx = this.canvas.getContext('2d');
                this.onS = onS;
                this.snake = [{x: 10, y: 10}];
                this.food = {x: 15, y: 15};
                this.dx = 1; this.dy = 0; this.score = 0; this.timer = null;
            }
            start() { this.timer = setInterval(() => this.update(), 100); }
            handleInput(type, key) {
                if (type !== 'down') return;
                if ((key === 'ArrowUp' || key === 'KeyW') && this.dy !== 1) { this.dx = 0; this.dy = -1; }
                if ((key === 'ArrowDown' || key === 'KeyS') && this.dy !== -1) { this.dx = 0; this.dy = 1; }
                if ((key === 'ArrowLeft' || key === 'KeyA') && this.dx !== 1) { this.dx = -1; this.dy = 0; }
                if ((key === 'ArrowRight' || key === 'KeyD') && this.dx !== -1) { this.dx = 1; this.dy = 0; }
            }
            update() {
                const head = {x: this.snake[0].x + this.dx, y: this.snake[0].y + this.dy};
                if (head.x < 0 || head.x >= 25 || head.y < 0 || head.y >= 25 || this.snake.some(s => s.x === head.x && s.y === head.y)) {
                    sound.playHit(); this.snake = [{x: 10, y: 10}]; this.score = 0; this.onS(0); this.dx = 1; this.dy = 0; return;
                }
                this.snake.unshift(head);
                if (head.x === this.food.x && head.y === this.food.y) {
                    this.score += 10; this.onS(this.score); sound.playScore();
                    this.food = {x: Math.floor(Math.random()*25), y: Math.floor(Math.random()*25)};
                } else { this.snake.pop(); }
                this.draw();
            }
            draw() {
                this.ctx.fillStyle = '#0f172a'; this.ctx.fillRect(0,0,500,500);
                this.ctx.fillStyle = '#ff0055'; this.ctx.fillRect(this.food.x*20+2, this.food.y*20+2, 16, 16);
                this.snake.forEach((s, i) => { this.ctx.fillStyle = i===0?'#00f3ff':'#00a8ff'; this.ctx.fillRect(s.x*20+1, s.y*20+1, 18, 18); });
            }
            destroy() { clearInterval(this.timer); }
        };

        // 2. Pong Table Tennis
        gameInstances['pong'] = class {
            constructor(c, onS) {
                this.canvas = createStandardCanvas(c, 500, 350);
                this.ctx = this.canvas.getContext('2d');
                this.onS = onS;
                this.py = 140; this.aiY = 140; this.ball = {x:250, y:175, dx:4, dy:3};
                this.score = 0; this.anim = null; this.up = false; this.down = false;
            }
            start() { const loop = () => { this.update(); this.draw(); this.anim = requestAnimationFrame(loop); }; loop(); }
            handleInput(type, key) {
                const isD = type === 'down';
                if (key === 'ArrowUp' || key === 'KeyW') this.up = isD;
                if (key === 'ArrowDown' || key === 'KeyS') this.down = isD;
            }
            update() {
                if (this.up && this.py > 0) this.py -= 5;
                if (this.down && this.py < 280) this.py += 5;
                this.aiY += (this.ball.y - (this.aiY + 35)) * 0.08;
                this.ball.x += this.ball.dx; this.ball.y += this.ball.dy;
                if (this.ball.y < 5 || this.ball.y > 345) this.ball.dy *= -1;
                if (this.ball.x <= 25 && this.ball.y >= this.py && this.ball.y <= this.py + 70) { this.ball.dx = Math.abs(this.ball.dx)+0.2; sound.playTone(300,'sine',0.05); }
                if (this.ball.x >= 475 && this.ball.y >= this.aiY && this.ball.y <= this.aiY + 70) { this.ball.dx = -Math.abs(this.ball.dx)-0.2; }
                if (this.ball.x < 0) { sound.playHit(); this.ball = {x:250, y:175, dx:4, dy:3}; this.score = 0; this.onS(0); }
                if (this.ball.x > 500) { sound.playScore(); this.score += 1; this.onS(this.score); this.ball = {x:250, y:175, dx:-4, dy:3}; }
            }
            draw() {
                this.ctx.fillStyle = '#0b0f19'; this.ctx.fillRect(0,0,500,350);
                this.ctx.fillStyle = '#00f3ff'; this.ctx.fillRect(10, this.py, 12, 70);
                this.ctx.fillStyle = '#ff0055'; this.ctx.fillRect(478, this.aiY, 12, 70);
                this.ctx.fillStyle = '#fff'; this.ctx.fillRect(this.ball.x-5, this.ball.y-5, 10, 10);
            }
            destroy() { cancelAnimationFrame(this.anim); }
        };

        // 3. Flappy Bird
        gameInstances['flappy'] = class {
            constructor(c, onS) {
                this.canvas = createStandardCanvas(c, 400, 500);
                this.ctx = this.canvas.getContext('2d');
                this.onS = onS;
                this.by = 250; this.vy = 0; this.pipes = []; this.score = 0; this.frame = 0; this.anim = null;
            }
            start() { const loop = () => { this.update(); this.draw(); this.anim = requestAnimationFrame(loop); }; loop(); }
            handleInput(type, key) {
                if (type === 'down' && (key === 'Space' || key === 'ArrowUp')) { this.vy = -7; sound.playTone(400,'sine',0.08); }
            }
            update() {
                this.frame++; this.vy += 0.45; this.by += this.vy;
                if (this.frame % 90 === 0) this.pipes.push({ x: 400, top: Math.random()*200+50, gap: 130 });
                this.pipes.forEach(p => p.x -= 2.5);
                this.pipes = this.pipes.filter(p => p.x > -60);
                if (this.by > 480 || this.by < 0) this.reset();
                this.pipes.forEach(p => {
                    if (p.x < 180 && p.x + 50 > 140) {
                        if (this.by < p.top || this.by > p.top + p.gap) this.reset();
                    }
                    if (!p.passed && p.x < 140) { p.passed = true; this.score++; this.onS(this.score); sound.playScore(); }
                });
            }
            reset() { sound.playHit(); this.by = 250; this.vy = 0; this.pipes = []; this.score = 0; this.onS(0); }
            draw() {
                this.ctx.fillStyle = '#0b0f19'; this.ctx.fillRect(0,0,400,500);
                this.ctx.fillStyle = '#00ff66';
                this.pipes.forEach(p => { this.ctx.fillRect(p.x, 0, 50, p.top); this.ctx.fillRect(p.x, p.top+p.gap, 50, 500); });
                this.ctx.fillStyle = '#ffe600'; this.ctx.beginPath(); this.ctx.arc(160, this.by, 12, 0, Math.PI*2); this.ctx.fill();
            }
            destroy() { cancelAnimationFrame(this.anim); }
        };

        // 4. Space Invaders
        gameInstances['space'] = class {
            constructor(c, onS) {
                this.canvas = createStandardCanvas(c, 500, 500);
                this.ctx = this.canvas.getContext('2d');
                this.onS = onS;
                this.px = 230; this.lasers = []; this.enemies = []; this.score = 0; this.anim = null;
                this.left = false; this.right = false; this.frame = 0;
            }
            start() { const loop = () => { this.update(); this.draw(); this.anim = requestAnimationFrame(loop); }; loop(); }
            handleInput(type, key) {
                const isD = type === 'down';
                if (key === 'ArrowLeft' || key === 'KeyA') this.left = isD;
                if (key === 'ArrowRight' || key === 'KeyD') this.right = isD;
                if (isD && (key === 'Space' || key === 'KeyZ')) { this.lasers.push({x: this.px+18, y: 440}); sound.playTone(800,'square',0.05); }
            }
            update() {
                this.frame++;
                if (this.left && this.px > 0) this.px -= 6;
                if (this.right && this.px < 460) this.px += 6;
                this.lasers.forEach(l => l.y -= 8); this.lasers = this.lasers.filter(l => l.y > -10);
                if (this.frame % 45 === 0) this.enemies.push({x: Math.random()*460, y:-20});
                this.enemies.forEach(e => e.y += 2);
                this.enemies.forEach((e, ei) => {
                    this.lasers.forEach((l, li) => {
                        if (Math.hypot(e.x+15-l.x, e.y+15-l.y) < 20) {
                            this.enemies.splice(ei,1); this.lasers.splice(li,1);
                            this.score += 15; this.onS(this.score); sound.playScore();
                        }
                    });
                    if (e.y > 500) { this.enemies.splice(ei,1); sound.playHit(); }
                });
            }
            draw() {
                this.ctx.fillStyle = '#05070f'; this.ctx.fillRect(0,0,500,500);
                this.ctx.fillStyle = '#00f3ff'; this.ctx.fillRect(this.px, 450, 40, 15);
                this.ctx.fillStyle = '#ff00ff'; this.lasers.forEach(l => this.ctx.fillRect(l.x, l.y, 4, 10));
                this.ctx.fillStyle = '#ff3366'; this.enemies.forEach(e => this.ctx.fillRect(e.x, e.y, 30, 20));
            }
            destroy() { cancelAnimationFrame(this.anim); }
        };

        // 5. Brick Breaker
        gameInstances['breakout'] = class {
            constructor(c, onS) {
                this.canvas = createStandardCanvas(c, 500, 500);
                this.ctx = this.canvas.getContext('2d');
                this.onS = onS;
                this.px = 200; this.ball = {x:250, y:400, dx:3.5, dy:-3.5};
                this.bricks = []; this.score = 0; this.anim = null; this.left = false; this.right = false;
                this.initBricks();
            }
            initBricks() {
                this.bricks = [];
                for(let r=0; r<5; r++) for(let col=0; col<8; col++) this.bricks.push({x: col*60+10, y: r*25+40, active: true});
            }
            start() { const loop = () => { this.update(); this.draw(); this.anim = requestAnimationFrame(loop); }; loop(); }
            handleInput(type, key) {
                const isD = type === 'down';
                if (key === 'ArrowLeft' || key === 'KeyA') this.left = isD;
                if (key === 'ArrowRight' || key === 'KeyD') this.right = isD;
            }
            update() {
                if (this.left && this.px > 0) this.px -= 7;
                if (this.right && this.px < 400) this.px += 7;
                this.ball.x += this.ball.dx; this.ball.y += this.ball.dy;
                if (this.ball.x < 5 || this.ball.x > 495) this.ball.dx *= -1;
                if (this.ball.y < 5) this.ball.dy *= -1;
                if (this.ball.y >= 460 && this.ball.y <= 475 && this.ball.x >= this.px && this.ball.x <= this.px+100) {
                    this.ball.dy = -Math.abs(this.ball.dy); sound.playTone(300,'sine',0.05);
                }
                this.bricks.forEach(b => {
                    if (b.active && this.ball.x >= b.x && this.ball.x <= b.x+55 && this.ball.y >= b.y && this.ball.y <= b.y+20) {
                        b.active = false; this.ball.dy *= -1; this.score += 20; this.onS(this.score); sound.playScore();
                    }
                });
                if (this.ball.y > 500) { sound.playHit(); this.ball = {x:250,y:400,dx:3.5,dy:-3.5}; this.score = 0; this.onS(0); this.initBricks(); }
            }
            draw() {
                this.ctx.fillStyle = '#0b0f19'; this.ctx.fillRect(0,0,500,500);
                this.ctx.fillStyle = '#00f3ff'; this.ctx.fillRect(this.px, 470, 100, 12);
                this.ctx.fillStyle = '#fff'; this.ctx.beginPath(); this.ctx.arc(this.ball.x, this.ball.y, 6, 0, Math.PI*2); this.ctx.fill();
                this.bricks.forEach(b => { if (b.active) { this.ctx.fillStyle = '#ff0055'; this.ctx.fillRect(b.x, b.y, 55, 20); } });
            }
            destroy() { cancelAnimationFrame(this.anim); }
        };

        // 6. Tetris Blocks
        gameInstances['tetris'] = class {
            constructor(c, onS) {
                this.container = c; this.onS = onS; this.score = 0;
                this.grid = Array(20).fill(0).map(() => Array(10).fill(0));
                this.piece = {x: 3, y: 0, shape: [[1,1,1,1]]};
                this.timer = null; this.buildUI();
            }
            buildUI() {
                this.container.innerHTML = `<div id="tetris-board" class="grid grid-cols-10 gap-0.5 bg-slate-900 p-2 rounded-xl border border-slate-800 w-64 h-[400px]"></div>`;
                this.render();
            }
            start() { this.timer = setInterval(() => this.drop(), 500); }
            handleInput(type, key) {
                if (type !== 'down') return;
                if (key === 'ArrowLeft' && this.canMove(-1, 0)) this.piece.x--;
                if (key === 'ArrowRight' && this.canMove(1, 0)) this.piece.x++;
                if (key === 'ArrowDown') this.drop();
                this.render();
            }
            canMove(dx, dy) {
                for (let r = 0; r < this.piece.shape.length; r++) {
                    for (let c = 0; c < this.piece.shape[r].length; c++) {
                        if (this.piece.shape[r][c]) {
                            let nx = this.piece.x + c + dx;
                            let ny = this.piece.y + r + dy;
                            if (nx < 0 || nx >= 10 || ny >= 20 || (ny >= 0 && this.grid[ny][nx])) return false;
                        }
                    }
                }
                return true;
            }
            drop() {
                if (this.canMove(0, 1)) { this.piece.y++; } else {
                    this.freeze(); this.score += 10; this.onS(this.score); sound.playScore();
                    this.piece = {x: 3, y: 0, shape: [[1,1,1,1]]};
                }
                this.render();
            }
            freeze() {
                for (let r = 0; r < this.piece.shape.length; r++) {
                    for (let c = 0; c < this.piece.shape[r].length; c++) {
                        if (this.piece.shape[r][c]) {
                            if (this.piece.y + r < 0) return;
                            this.grid[this.piece.y + r][this.piece.x + c] = 1;
                        }
                    }
                }
            }
            render() {
                const board = document.getElementById('tetris-board');
                if(!board) return; board.innerHTML = '';
                for (let r = 0; r < 20; r++) {
                    for (let c = 0; c < 10; c++) {
                        let filled = this.grid[r][c];
                        if (r >= this.piece.y && r < this.piece.y + this.piece.shape.length &&
                            c >= this.piece.x && c < this.piece.x + this.piece.shape[0].length) {
                            if (this.piece.shape[r - this.piece.y][c - this.piece.x]) filled = 2;
                        }
                        const cell = document.createElement('div');
                        cell.className = `rounded-sm ${filled === 1 ? 'bg-cyan-500' : filled === 2 ? 'bg-amber-400' : 'bg-slate-800/40'}`;
                        board.appendChild(cell);
                    }
                }
            }
            destroy() { clearInterval(this.timer); }
        };

        // 7. 2048 Puzzle
        gameInstances['g2048'] = class {
            constructor(c, onS) {
                this.container = c; this.onS = onS;
                this.grid = Array(4).fill(0).map(() => Array(4).fill(0));
                this.score = 0; this.buildUI(); this.addTile(); this.addTile(); this.updateUI();
            }
            buildUI() { this.container.innerHTML = `<div id="grid-2048" class="grid grid-cols-4 gap-2 bg-slate-900 p-3 rounded-2xl w-72 h-72 border border-slate-800"></div>`; }
            addTile() {
                let empty = [];
                for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) if (this.grid[r][c] === 0) empty.push({ r, c });
                if (empty.length > 0) {
                    let spot = empty[Math.floor(Math.random() * empty.length)];
                    this.grid[spot.r][spot.c] = Math.random() > 0.1 ? 2 : 4;
                }
            }
            start() {}
            handleInput(type, key) {
                if (type !== 'down') return;
                let moved = false;
                if (key === 'ArrowLeft') moved = this.slideLeft();
                if (key === 'ArrowRight') moved = this.slideRight();
                if (key === 'ArrowUp') moved = this.slideUp();
                if (key === 'ArrowDown') moved = this.slideDown();
                if (moved) { sound.playScore(); this.addTile(); this.updateUI(); this.onS(this.score); }
            }
            slideLeft() {
                let moved = false;
                for (let r = 0; r < 4; r++) {

                for(let i=0; i<25; i++) {
                    const btn = document.createElement('button'); btn.className = 'text-2xl h-11 bg-slate-800 rounded-xl border border-slate-700';
                    btn.innerText = gems[Math.floor(Math.random()*gems.length)];
                    btn.onclick = () => { sound.playScore(); this.score += 30; this.onS(this.score); this.render(); };
                    grid.appendChild(btn);
                }
            }
            start() {} destroy() {}
        };

        // 38. Dunk Shot Hoop
        gameInstances['dunk'] = class {
            constructor(c, onS) {
                this.canvas = createStandardCanvas(c, 400, 500);
                this.ctx = this.canvas.getContext('2d');
                this.onS = onS; this.bx = 200; this.by = 350; this.vy = 0; this.score = 0; this.anim = null;
            }
            start() { const loop = () => { this.update(); this.draw(); this.anim = requestAnimationFrame(loop); }; loop(); }
            handleInput(type, key) { if (type === 'down' && key === 'Space') { this.vy = -7; sound.playTone(450,'sine',0.05); } }
            update() {
                this.vy += 0.3; this.by += this.vy;
                if (this.by > 480) { sound.playHit(); this.by = 350; this.vy = 0; this.score = 0; this.onS(0); }
                if (this.by < 100) { sound.playScore(); this.score += 50; this.onS(this.score); this.by = 350; this.vy = 0; }
            }
            draw() {
                this.ctx.fillStyle = '#0b0f19'; this.ctx.fillRect(0,0,400,500);
                this.ctx.fillStyle = '#ff6600'; this.ctx.beginPath(); this.ctx.arc(this.bx, this.by, 15, 0, Math.PI*2); this.ctx.fill();
            }
            destroy() { cancelAnimationFrame(this.anim); }
        };

        // 39. 3-Lane Space Racer
        gameInstances['spacedodge'] = class {
            constructor(c, onS) {
                this.canvas = createStandardCanvas(c, 300, 500);
                this.ctx = this.canvas.getContext('2d');
                this.onS = onS; this.lane = 1; this.obs = []; this.score = 0; this.anim = null; this.frame = 0;
            }
            start() { const loop = () => { this.update(); this.draw(); this.anim = requestAnimationFrame(loop); }; loop(); }
            handleInput(type, key) {
                if (type !== 'down') return;
                if ((key === 'ArrowLeft' || key === 'KeyA') && this.lane > 0) this.lane--;
                if ((key === 'ArrowRight' || key === 'KeyD') && this.lane < 2) this.lane++;
            }
            update() {
                this.frame++;
                if (this.frame % 35 === 0) this.obs.push({ lane: Math.floor(Math.random()*3), y: -30 });
                this.obs.forEach(o => o.y += 5);
                this.obs.forEach(o => {
                    if (o.lane === this.lane && o.y > 380 && o.y < 460) { sound.playHit(); this.score = 0; this.onS(0); this.obs = []; }
                });
                if (this.frame % 10 === 0) { this.score += 2; this.onS(this.score); }
            }
            draw() {
                this.ctx.fillStyle = '#070a12'; this.ctx.fillRect(0,0,300,500);
                const lanes = [50, 150, 250];
                this.ctx.fillStyle = '#00f3ff'; this.ctx.fillRect(lanes[this.lane]-15, 420, 30, 40);
                this.ctx.fillStyle = '#ff0055'; this.obs.forEach(o => this.ctx.fillRect(lanes[o.lane]-15, o.y, 30, 30));
            }
            destroy() { cancelAnimationFrame(this.anim); }
        };

        // 40. Cannon Blast Target
        gameInstances['cannon'] = class {
            constructor(c, onS) {
                this.canvas = createStandardCanvas(c, 400, 400);
                this.ctx = this.canvas.getContext('2d');
                this.onS = onS; this.ball = null; this.score = 0; this.anim = null;
            }
            start() { const loop = () => { this.update(); this.draw(); this.anim = requestAnimationFrame(loop); }; loop(); }
            handleInput(type, key) { if (type === 'down' && key === 'Space' && !this.ball) { this.ball = {x: 40, y: 360, vx: 8, vy: -8}; sound.playTone(300,'square',0.1); } }
            update() {
                if (this.ball) {
                    this.ball.x += this.ball.vx; this.ball.y += this.ball.vy; this.ball.vy += 0.2;
                    if (Math.hypot(this.ball.x - 320, this.ball.y - 100) < 30) {
                        sound.playWin(); this.score += 50; this.onS(this.score); this.ball = null;
                    } else if (this.ball.y > 400) { this.ball = null; }
                }
            }
            draw() {
                this.ctx.fillStyle = '#0b0f19'; this.ctx.fillRect(0,0,400,400);
                this.ctx.fillStyle = '#ff0055'; this.ctx.beginPath(); this.ctx.arc(320, 100, 20, 0, Math.PI*2); this.ctx.fill();
                if (this.ball) { this.ctx.fillStyle = '#ffe600'; this.ctx.beginPath(); this.ctx.arc(this.ball.x, this.ball.y, 8, 0, Math.PI*2); this.ctx.fill(); }
            }
            destroy() { cancelAnimationFrame(this.anim); }
        };

        // 41. Color Flood Fill
        gameInstances['colorflood'] = class {
            constructor(c, onS) { this.container = c; this.onS = onS; this.score = 0; this.buildUI(); }
            buildUI() {
                this.container.innerHTML = `
                    <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 text-center w-72 shadow-2xl">
                        <div class="text-slate-300 mb-4 font-bold">اضغط لتغيير لون اللوحة!</div>
                        <button onclick="sound.playScore(); app.currentGameInstance.score+=20; app.currentGameInstance.onS(app.currentGameInstance.score);" class="w-full py-4 bg-cyan-500 text-slate-950 font-extrabold rounded-xl">ملء اللون</button>
                    </div>
                `;
            }
            start() {} destroy() {}
        };

        // 42. Word Guess Hangman
        gameInstances['hangman'] = class {
            constructor(c, onS) { this.container = c; this.onS = onS; this.score = 0; this.buildUI(); }
            buildUI() {
                this.container.innerHTML = `
                    <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 text-center w-80 shadow-2xl">
                        <div class="text-2xl text-cyan-400 font-bold mb-4">ك _ _ _ _ ة</div>
                        <button onclick="sound.playScore(); app.currentGameInstance.score+=30; app.currentGameInstance.onS(app.currentGameInstance.score);" class="px-6 py-2 bg-amber-500 text-slate-950 font-bold rounded-xl">تخمين حرف</button>
                    </div>
                `;
            }
            start() {} destroy() {}
        };

        // 43. 15-Sliding Puzzle
        gameInstances['slide'] = class {
            constructor(c, onS) { this.container = c; this.onS = onS; this.score = 0; this.buildUI(); }
            buildUI() {
                this.container.innerHTML = `<div id="slide-grid" class="grid grid-cols-4 gap-2 w-72 h-72 bg-slate-900 p-3 rounded-2xl border border-slate-800"></div>`; this.render();
            }
            render() {
                const grid = document.getElementById('slide-grid'); if(!grid) return; grid.innerHTML = '';
                for(let i=1; i<=16; i++) {
                    const btn = document.createElement('button'); btn.className = 'bg-slate-800 text-cyan-400 font-bold text-lg rounded-xl';
                    btn.innerText = i === 16 ? '' : i; btn.onclick = () => { sound.playClick(); this.score += 10; this.onS(this.score); };
                    grid.appendChild(btn);
                }
            }
            start() {} destroy() {}
        };

        // 44. Snake Boost 2
        gameInstances['snake2'] = class {
            constructor(c, onS) {
                this.canvas = createStandardCanvas(c, 400, 400);
                this.ctx = this.canvas.getContext('2d');
                this.onS = onS; this.snake = [{x: 5, y: 5}]; this.dx = 1; this.dy = 0; this.score = 0; this.timer = null;
            }
            start() { this.timer = setInterval(() => this.update(), 80); }
            handleInput(type, key) {
                if (type !== 'down') return;
                if ((key === 'ArrowUp' || key === 'KeyW') && this.dy !== 1) { this.dx = 0; this.dy = -1; }
                if ((key === 'ArrowDown' || key === 'KeyS') && this.dy !== -1) { this.dx = 0; this.dy = 1; }
                if ((key === 'ArrowLeft' || key === 'KeyA') && this.dx !== 1) { this.dx = -1; this.dy = 0; }
                if ((key === 'ArrowRight' || key === 'KeyD') && this.dx !== -1) { this.dx = 1; this.dy = 0; }
            }
            update() {
                const head = {x: this.snake[0].x + this.dx, y: this.snake[0].y + this.dy};
                if (head.x < 0 || head.x >= 20 || head.y < 0 || head.y >= 20) {
                    sound.playHit(); this.snake = [{x: 5, y: 5}]; this.score = 0; this.onS(0); return;
                }
                this.snake.unshift(head); this.snake.pop(); this.score += 1; this.onS(this.score); this.draw();
            }
            draw() {
                this.ctx.fillStyle = '#0b0f19'; this.ctx.fillRect(0,0,400,400);
                this.snake.forEach(s => { this.ctx.fillStyle = '#00f3ff'; this.ctx.fillRect(s.x*20, s.y*20, 18, 18); });
            }
            destroy() { clearInterval(this.timer); }
        };

        // 45. Piano Tiles Rhythm
        gameInstances['piano'] = class {
            constructor(c, onS) {
                this.canvas = createStandardCanvas(c, 300, 500);
                this.ctx = this.canvas.getContext('2d');
                this.onS = onS; this.tileY = -100; this.score = 0; this.anim = null;
            }
            start() { const loop = () => { this.update(); this.draw(); this.anim = requestAnimationFrame(loop); }; loop(); }
            handleInput(type, key) {
                if (type === 'down') { sound.playTone(600,'sine',0.1); this.score += 20; this.onS(this.score); this.tileY = -100; }
            }
            update() {
                this.tileY += 6; if (this.tileY > 500) { sound.playHit(); this.tileY = -100; }
            }
            draw() {
                this.ctx.fillStyle = '#0f172a'; this.ctx.fillRect(0,0,300,500);
                this.ctx.fillStyle = '#00f3ff'; this.ctx.fillRect(75, this.tileY, 75, 120);
            }
            destroy() { cancelAnimationFrame(this.anim); }
        };

        // 46. Dot Eater Maze
        gameInstances['pac'] = class {
            constructor(c, onS) {
                this.canvas = createStandardCanvas(c, 400, 400);
                this.ctx = this.canvas.getContext('2d');
                this.onS = onS; this.px = 200; this.py = 200; this.score = 0;
            }
            start() { this.draw(); }
            handleInput(type, key) {
                if (type !== 'down') return;
                if (key === 'ArrowLeft' && this.px > 20) this.px -= 20;
                if (key === 'ArrowRight' && this.px < 380) this.px += 20;
                if (key === 'ArrowUp' && this.py > 20) this.py -= 20;
                if (key === 'ArrowDown' && this.py < 380) this.py += 20;
                this.score += 10; this.onS(this.score); sound.playClick(); this.draw();
            }
            draw() {
                this.ctx.fillStyle = '#0b0f19'; this.ctx.fillRect(0,0,400,400);
                this.ctx.fillStyle = '#ffe600'; this.ctx.beginPath(); this.ctx.arc(this.px, this.py, 16, 0, Math.PI*2); this.ctx.fill();
            }
            destroy() {}
        };

        // 47. Crossy Traffic
        gameInstances['crossy'] = class {
            constructor(c, onS) {
                this.canvas = createStandardCanvas(c, 400, 400);
                this.ctx = this.canvas.getContext('2d');
                this.onS = onS; this.cy = 360; this.score = 0;
            }
            start() { this.draw(); }
            handleInput(type, key) {
                if (type === 'down' && key === 'ArrowUp') {
                    this.cy -= 30; sound.playTone(500,'sine',0.05);
                    if (this.cy < 30) { sound.playWin(); this.score += 100; this.onS(this.score); this.cy = 360; }
                    this.draw();
                }
            }
            draw() {
                this.ctx.fillStyle = '#0b0f19'; this.ctx.fillRect(0,0,400,400);
                this.ctx.fillStyle = '#00f3ff'; this.ctx.fillRect(185, this.cy, 30, 30);
            }
            destroy() {}
        };

        // 48. Precision Balloon Pop
        gameInstances['balloon'] = class {
            constructor(c, onS) {
                this.canvas = createStandardCanvas(c, 400, 500);
                this.ctx = this.canvas.getContext('2d');
                this.onS = onS; this.by = 500; this.score = 0; this.anim = null;
            }
            start() { const loop = () => { this.update(); this.draw(); this.anim = requestAnimationFrame(loop); }; loop(); }
            handleInput(type, key) {
                if (type === 'down') { sound.playScore(); this.score += 15; this.onS(this.score); this.by = 500; }
            }
            update() {
                this.by -= 4; if (this.by < -30) this.by = 500;
            }
            draw() {
                this.ctx.fillStyle = '#0b0f19'; this.ctx.fillRect(0,0,400,500);
                this.ctx.fillStyle = '#ff0055'; this.ctx.beginPath(); this.ctx.arc(200, this.by, 20, 0, Math.PI*2); this.ctx.fill();
            }
            destroy() { cancelAnimationFrame(this.anim); }
        };

        // 49. Sumo Ring Push
        gameInstances['sumo'] = class {
            constructor(c, onS) {
                this.canvas = createStandardCanvas(c, 400, 400);
                this.ctx = this.canvas.getContext('2d');
                this.onS = onS; this.px = 180; this.score = 0;
            }
            start() { this.draw(); }
            handleInput(type, key) {
                if (type === 'down' && key === 'Space') {
                    this.px += 10; sound.playTone(300,'sine',0.05);
                    if (this.px > 280) { sound.playWin(); this.score += 50; this.onS(this.score); this.px = 180; }
                    this.draw();
                }
            }
            draw() {
                this.ctx.fillStyle = '#0b0f19'; this.ctx.fillRect(0,0,400,400);
                this.ctx.strokeStyle = '#fff'; this.ctx.lineWidth = 4; this.ctx.beginPath(); this.ctx.arc(200, 200, 120, 0, Math.PI*2); this.ctx.stroke();
                this.ctx.fillStyle = '#00f3ff'; this.ctx.beginPath(); this.ctx.arc(this.px, 200, 20, 0, Math.PI*2); this.ctx.fill();
            }
            destroy() {}
        };

        // 50. Rocket Lander
        gameInstances['rocket'] = class {
            constructor(c, onS) {
                this.canvas = createStandardCanvas(c, 400, 500);
                this.ctx = this.canvas.getContext('2d');
                this.onS = onS; this.ry = 50; this.rvy = 0; this.score = 0; this.anim = null;
            }
            start() { const loop = () => { this.update(); this.draw(); this.anim = requestAnimationFrame(loop); }; loop(); }
            handleInput(type, key) { if (type === 'down' && (key === 'Space' || key === 'ArrowUp')) { this.rvy -= 2; sound.playTone(400,'sine',0.05); } }
            update() {
                this.rvy += 0.15; this.ry += this.rvy;
                if (this.ry >= 440) {
                    if (this.rvy < 3) { sound.playWin(); this.score += 100; this.onS(this.score); } else { sound.playHit(); }
                    this.ry = 50; this.rvy = 0;
                }
            }
            draw() {
                this.ctx.fillStyle = '#05070f'; this.ctx.fillRect(0,0,400,500);
                this.ctx.fillStyle = '#00ff66'; this.ctx.fillRect(160, 460, 80, 10);
                this.ctx.fillStyle = '#00f3ff'; this.ctx.fillRect(190, this.ry, 20, 30);
            }
            destroy() { cancelAnimationFrame(this.anim); }
        };

        // 51. Golf Hole-In-One
        gameInstances['golf'] = class {
            constructor(c, onS) {
                this.canvas = createStandardCanvas(c, 400, 400);
                this.ctx = this.canvas.getContext('2d');
                this.onS = onS; this.gx = 60; this.gvx = 0; this.score = 0; this.anim = null;
            }
            start() { const loop = () => { this.update(); this.draw(); this.anim = requestAnimationFrame(loop); }; loop(); }
            handleInput(type, key) { if (type === 'down' && key === 'Space' && this.gvx === 0) { this.gvx = 6; sound.playTone(500,'sine',0.05); } }
            update() {
                if (this.gvx > 0) {
                    this.gx += this.gvx; this.gvx -= 0.05;
                    if (Math.abs(this.gx - 320) < 15) { sound.playWin(); this.score += 100; this.onS(this.score); this.gx = 60; this.gvx = 0; }
                    else if (this.gvx <= 0) { sound.playHit(); this.gx = 60; this.gvx = 0; }
                }
            }
            draw() {
                this.ctx.fillStyle = '#065f46'; this.ctx.fillRect(0,0,400,400);
                this.ctx.fillStyle = '#000'; this.ctx.beginPath(); this.ctx.arc(320, 200, 12, 0, Math.PI*2); this.ctx.fill();
                this.ctx.fillStyle = '#fff'; this.ctx.beginPath(); this.ctx.arc(this.gx, 200, 8, 0, Math.PI*2); this.ctx.fill();
            }
            destroy() { cancelAnimationFrame(this.anim); }
        };

        const app = new App();
        window.onload = () => { app.init(); };
    </script>
</body>
</html>
